name: Bug report
description: Something in Highball itself broke (for game results, use the report form on highball-db)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Write as much as you need.
    validations: { required: true }
  - type: input
    id: chip
    attributes: { label: Chip and macOS, placeholder: "M1 Pro, macOS 14.6" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Highball version, placeholder: "0.3.1" }
    validations: { required: true }
  - type: textarea
    id: log
    attributes: { label: Log, description: "Attach or paste the newest file from ~/Library/Application Support/Highball/logs/" }
