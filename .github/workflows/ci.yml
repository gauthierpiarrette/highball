name: CI
on:
  push: { branches: [main] }
  pull_request:
# Least privilege: CI only needs to read the checkout. No token write scope.
permissions:
  contents: read
# One in-flight run per ref; a newer push/PR update cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Upgrade smoke (an existing install is still seen; headless)
        run: Scripts/upgrade-smoke.sh
      - name: Validate recipes against the CLI (from highball-db)
        run: |
          git clone --depth 1 https://github.com/gauthierpiarrette/highball-db.git ../highball-db
          for f in ../highball-db/recipes/launchers/*.json ../highball-db/recipes/games/*.json; do
            .build/debug/highball recipe show "$f" > /dev/null || exit 1
          done
